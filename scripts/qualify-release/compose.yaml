services:
  data:
    image: alpine:3.23.3
    command:
      - sh
      - -c
      - test -s /data/identity || printf 'qualify-persistent-data\n' > /data/identity; exec httpd -f -p 8080 -h /data
    volumes:
      - qualify-data:/data
    x-machines: [qualify-1]
    x-ports: [18082:8080/tcp@host]
volumes:
  qualify-data:
