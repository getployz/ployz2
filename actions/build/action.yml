name: Ployz build
description: Build one Ployz Image Build on this runner and push it into the Machine that Ployz Cloud chose.
branding:
  icon: package
  color: gray-dark
inputs:
  build:
    description: Image Build id that Ployz Cloud dispatched.
    required: true
  cloud:
    description: Ployz Cloud URL that dispatched the build, for example https://ployz.dev.
    required: true
  ployz_version:
    description: Exact ployz version to install. Cloud sends its own SDK version so the build fingerprint matches.
    required: true
outputs:
  digest:
    description: Manifest digest that the Machine received.
    value: ${{ steps.build.outputs.digest }}
runs:
  using: composite
  steps:
    # Exposes ACTIONS_RUNTIME_TOKEN and the cache URLs so `ployz build` can use the GitHub Actions cache.
    - uses: crazy-max/ghaction-github-runtime@v3
    - id: prepare
      shell: bash
      env:
        PLOYZ_BUILD_ID: ${{ inputs.build }}
        PLOYZ_CLOUD: ${{ inputs.cloud }}
        PLOYZ_VERSION: ${{ inputs.ployz_version }}
      run: '"$GITHUB_ACTION_PATH/prepare.sh"'
    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.prepare.outputs.commit }}
        persist-credentials: false
    - id: build
      shell: bash
      env:
        PLOYZ_BUILD_ID: ${{ inputs.build }}
        PLOYZ_CLOUD: ${{ inputs.cloud }}
      run: '"$GITHUB_ACTION_PATH/build.sh"'
    - if: always()
      shell: bash
      run: rm -rf "$RUNNER_TEMP/ployz-build"
